# Build nurunuru-frames-ai-<version>.zip from extension/ and publish it as release v<version>
# (version = extension/manifest.json). Runs on a pushed tag v* (which must match the manifest)
# or manually from the Actions tab, which creates the tag on the current commit.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          v="$(jq -r .version extension/manifest.json)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "manifest version $v does not match tag $GITHUB_REF_NAME"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build zip
        run: |
          mkdir -p dist
          cp -r extension dist/nurunuru-frames-ai
          (cd dist && zip -qr "nurunuru-frames-ai-$VERSION.zip" nurunuru-frames-ai)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$VERSION" in 0.*|*-*) pre=--prerelease;; esac
          gh release create "v$VERSION" "dist/nurunuru-frames-ai-$VERSION.zip" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file .github/release-notes.md $pre
