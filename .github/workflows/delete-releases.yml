# Delete the given releases (their tags are kept). Run manually from the Actions tab.
name: delete-releases
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Release tags to delete, separated by spaces'
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        run: |
          for t in $TAGS; do
            case "$t" in v[0-9]*) gh release delete "$t" --yes;; *) echo "skip $t"; exit 1;; esac
          done
